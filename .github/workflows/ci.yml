name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests compile every file of the examples repository, which
      # sits beside this one in the workspace layout.
      - name: Check out the examples beside this repository
        run: git clone --depth 1 https://github.com/alloy-luau/examples ../examples
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the examples and hold them to the formatter
        run: |
          cargo run -q -- check
          cargo run -q -- fmt --check ../examples
