name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests compile every file of the examples repository, which
      # sits beside this one in the workspace layout. It is private, so
      # the checkout takes EXAMPLES_TOKEN, a fine-grained token with
      # read access to it; without one the example tests skip.
      - name: Check out the examples
        id: examples
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: alloy-luau/examples
          token: ${{ secrets.EXAMPLES_TOKEN || github.token }}
          path: examples-repo
      - name: Put the examples beside this repository
        if: steps.examples.outcome == 'success'
        run: ln -s "$GITHUB_WORKSPACE/examples-repo" ../examples
      - name: Warn when the examples are missing
        if: steps.examples.outcome != 'success'
        run: echo "::warning::no access to alloy-luau/examples; add the EXAMPLES_TOKEN secret or make the repository public. The example tests skip."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the examples and hold them to the formatter
        if: steps.examples.outcome == 'success'
        run: |
          cargo run -q -- check
          cargo run -q -- fmt --check ../examples
