# Posts an embed to Discord for each push, and for each pull request
# that opens, closes, or merges. The other Alloy repositories call this
# file, so the embed looks the same in all of them. Each repository
# names its webhook in the DISCORD_WEBHOOK variable; a repository
# without one skips the job.
#
# pull_request_target runs with the base repository's variables, so a
# pull request from a fork also posts. The job never checks out the
# pull request's code, and the payload reaches the script as data, so
# no text from the pull request runs as code.
name: Discord

on:
  push:
    branches: ["**"]
  pull_request_target:
    types: [opened, closed]
  workflow_call:
    inputs:
      webhook:
        type: string
        required: true

permissions: {}

jobs:
  notify:
    if: (inputs.webhook || vars.DISCORD_WEBHOOK) != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ inputs.webhook || vars.DISCORD_WEBHOOK }}
        with:
          script: |
            const e = context.payload
            const repo = e.repository
            const cut = (text, n) => (text.length > n ? `${text.slice(0, n - 3).trimEnd()}...` : text)
            const footer = { text: repo.full_name, icon_url: repo.owner.avatar_url }
            let embed

            if (context.eventName === 'push') {
              // A deleted branch pushes no commits.
              const commits = e.commits ?? []

              if (commits.length === 0) {
                return
              }

              const branch = e.ref.replace('refs/heads/', '')
              const lines = commits
                .slice(-10)
                .map((c) => `[\`${c.id.slice(0, 7)}\`](${c.url}) ${cut(c.message.split('\n')[0], 72)} - ${c.author.username ?? c.author.name}`)

              if (commits.length > 10) {
                lines.unshift(`*${commits.length - 10} earlier commits not shown*`)
              }

              embed = {
                author: { name: e.sender.login, url: e.sender.html_url, icon_url: e.sender.avatar_url },
                title: `${commits.length} new commit${commits.length === 1 ? '' : 's'} on ${branch}`,
                url: e.compare,
                description: lines.join('\n'),
                color: 0xa78bfa,
                footer,
                timestamp: e.head_commit?.timestamp ?? new Date().toISOString(),
              }
            } else {
              const pr = e.pull_request
              const state =
                e.action === 'closed' ? (pr.merged ? 'merged' : 'closed') : pr.draft ? 'draft' : e.action
              const [label, color] = {
                opened: ['Opened', 0x3fb950],
                draft: ['Opened as a draft', 0x6e7681],
                merged: ['Merged', 0x8957e5],
                closed: ['Closed without merging', 0xf85149],
              }[state] ?? [state, 0x6e7681]
              const by = state === 'merged' && pr.merged_by ? ` by ${pr.merged_by.login}` : ''
              const body = (pr.body ?? '').replace(/\r/g, '').trim()
              const fields = [
                { name: 'Branch', value: `\`${pr.head.label}\` -> \`${pr.base.ref}\`` },
                { name: 'Diff', value: `\`\`\`diff\n+ ${pr.additions}\n- ${pr.deletions}\n\`\`\``, inline: true },
                { name: 'Files', value: `\`\`\`\n${pr.changed_files}\n\`\`\``, inline: true },
                { name: 'Commits', value: `\`\`\`\n${pr.commits}\n\`\`\``, inline: true },
              ]

              if (pr.labels.length > 0) {
                fields.push({ name: 'Labels', value: pr.labels.map((l) => `\`${l.name}\``).join(' ') })
              }

              embed = {
                author: { name: pr.user.login, url: pr.user.html_url, icon_url: pr.user.avatar_url },
                title: cut(`#${pr.number} ${pr.title}`, 256),
                url: pr.html_url,
                description: `**${label}**${by}${body ? `\n>>> ${cut(body, 350)}` : ''}`,
                color,
                fields,
                thumbnail: { url: repo.owner.avatar_url },
                footer,
                timestamp: pr.merged_at ?? pr.closed_at ?? pr.updated_at,
              }
            }

            // No mention in a title or a commit message pings anyone.
            const res = await fetch(process.env.WEBHOOK, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'Alloy',
                avatar_url: repo.owner.avatar_url,
                allowed_mentions: { parse: [] },
                embeds: [embed],
              }),
            })

            if (!res.ok) {
              core.setFailed(`Discord answered ${res.status}: ${await res.text()}`)
            }
