# Releases one crate. The tag picks the crate:
#   alloy-syntax-v1.2.3 -> alloy-syntax (package alloy-syntax, library only)
#   alloy-v1.2.3      -> alloy            (package alloy-luau,     bin alloy)
#   alloy-lsp-v1.2.3  -> alloy-lsp        (package alloy-luau-lsp, bin alloy-lsp)
# The job fails when the tag version and the Cargo.toml version differ.
name: Release crate

on:
  push:
    tags:
      - "alloy-syntax-v*"
      - "alloy-v*"
      - "alloy-lsp-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Read tag
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      package: ${{ steps.parse.outputs.package }}
      bin: ${{ steps.parse.outputs.bin }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          tag="$GITHUB_REF_NAME"
          crate="${tag%-v*}"
          version="${tag##*-v}"
          case "$crate" in
            alloy-syntax) package=alloy-syntax; bin="" ;;
            alloy)     package=alloy-luau;     bin=alloy ;;
            alloy-lsp) package=alloy-luau-lsp; bin=alloy-lsp ;;
            *) echo "unknown tag prefix: $crate"; exit 1 ;;
          esac
          manifest="$crate/Cargo.toml"
          found=$(grep -m1 '^version' "$manifest" | sed 's/.*"\(.*\)".*/\1/')
          if [ "$found" != "$version" ]; then
            echo "tag says $version but $manifest says $found"
            exit 1
          fi
          {
            echo "crate=$crate"
            echo "package=$package"
            echo "bin=$bin"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    # A library crate has no binary to build.
    if: needs.meta.outputs.bin != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ${{ needs.meta.outputs.package }} --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="${{ needs.meta.outputs.bin }}"
          name="$bin-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$name.tar.gz" "$bin"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "${{ needs.meta.outputs.bin }}"
          $name = "$bin-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/$bin.exe" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: GitHub release
    needs: [meta, build]
    if: always() && needs.meta.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.meta.outputs.bin != ''
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls dist/* 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ needs.meta.outputs.crate }} ${{ needs.meta.outputs.version }}" \
            --generate-notes \
            $files

  publish:
    name: Publish to crates.io
    needs: [meta, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked -p ${{ needs.meta.outputs.package }}
