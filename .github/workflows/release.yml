# Releases Alloy on a tag like v1.2.3: one zip per platform with both
# binaries, a GitHub release that carries them, and the crates on
# crates.io. The job fails when the tag and the crate versions differ.
#
# The crates.io publish needs the repository secret CARGO_REGISTRY_TOKEN,
# an API token from https://crates.io/settings/tokens with publish scope.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Read the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in alloy-syntax luaux alloy alloy-lsp; do
            found=$(grep -m1 '^version' "$crate/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
            if [ "$found" != "$version" ]; then
              echo "tag says $version but $crate/Cargo.toml says $found"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release --locked -p alloy-luau -p alloy-luau-lsp --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="alloy-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/alloy" "target/${{ matrix.target }}/release/alloy-lsp" README.md "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          rm -r "dist/$name"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "alloy-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/alloy.exe", "target/${{ matrix.target }}/release/alloy-lsp.exe", "README.md" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip

  release:
    name: GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Alloy ${{ needs.meta.outputs.version }}" \
            --generate-notes \
            dist/*.zip

  publish:
    name: Publish to crates.io
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          for package in alloy-syntax alloy-luaux alloy-luau alloy-luau-lsp; do
            cargo publish --locked -p "$package"
          done
