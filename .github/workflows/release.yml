# Releases Alloy on a tag like v1.2.3: two zips per platform, one per
# binary, a GitHub release that carries them, and the crates on
# crates.io. The job fails when the tag and the crate versions differ.
#
# Each zip holds its binary at the root, so `alloy self update` unpacks
# it and finds the executable with no folder to strip.
#
# The crates.io publish needs the repository secret CARGO_REGISTRY_TOKEN,
# an API token from https://crates.io/settings/tokens with publish scope.
name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run builds and zips every target and stops there. It makes no
  # release and publishes nothing, so the matrix is provable before a tag
  # starts the one-way half of this workflow.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Read the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          # The tag carries the version, `v0.1.0-rc` or `v1.2.3`, and
          # every crate of the workspace must already say the same. A dry
          # run has no tag, so it takes the version from the workspace and
          # still checks that every crate agrees.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
            echo "dry run at workspace version $version"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          for crate in alloy-syntax luaux alloy-ingot alloy alloy-lsp alloy-web; do
            found=$(grep -m1 '^version' "$crate/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
            if [ "$found" != "$version" ]; then
              echo "the release is $version but $crate/Cargo.toml says $found"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-13, the Intel runner, is retired, and a job that asks
          # for it queues forever. The Apple Silicon runner cross-compiles
          # the Intel target; both SDKs ship with Xcode.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release --locked -p alloy-luau -p alloy-luau-lsp --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ needs.meta.outputs.version }}"
          target="${{ matrix.target }}"
          bin="target/$target/release"
          mkdir -p dist
          # -j drops the paths, so each entry sits at the zip's root.
          docs=(README.md)
          if [ -f LICENSE ]; then docs+=(LICENSE); fi
          zip -qj "dist/alloy-$version-$target.zip" "$bin/alloy" "${docs[@]}"
          zip -qj "dist/alloy-lsp-$version-$target.zip" "$bin/alloy-lsp"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          $target = "${{ matrix.target }}"
          $bin = "target/$target/release"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Named files, not a folder, so each entry sits at the root.
          $docs = @("README.md")
          if (Test-Path LICENSE) { $docs += "LICENSE" }
          Compress-Archive -Path (@("$bin/alloy.exe") + $docs) -DestinationPath "dist/alloy-$version-$target.zip"
          Compress-Archive -Path "$bin/alloy-lsp.exe" -DestinationPath "dist/alloy-lsp-$version-$target.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip

  release:
    name: GitHub release
    needs: [meta, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release, with every zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Alloy ${{ needs.meta.outputs.version }}" \
            --generate-notes \
            dist/*.zip

  publish:
    name: Publish to crates.io
    needs: [meta, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          # alloy-luau depends on alloy-ingot by version, so that one
          # goes up first.
          for package in alloy-syntax alloy-luaux alloy-ingot alloy-luau alloy-luau-lsp; do
            cargo publish --locked -p "$package"
          done
