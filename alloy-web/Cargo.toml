[package]
name = "alloy-web"
version = "0.1.0-rc.2"
description = "The Alloy compiler and its editor answers, for the playground in a browser."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy = { package = "alloy-luau", path = "../alloy" }
alloy-syntax = { path = "../alloy-syntax" }
serde_json = "1"
wasm-bindgen = "0.2"

[lints]
workspace = true

# The Rust target writes bulk-memory ops; wasm-opt must be told.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O2", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
