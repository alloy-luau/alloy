[package]
name = "alloy-luau"
default-run = "alloy"
version = "0.1.0-rc.5"
description = "Alloy: a strict superset of Luau that transpiles to plain Luau"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["luau", "roblox", "transpiler"]
categories = ["compilers", "development-tools"]

[lib]
name = "alloy"
path = "src/lib.rs"

[[bin]]
name = "alloy"
path = "src/main.rs"

[dependencies]
# The fork of luaux 0.2.0 in crates/luaux; see its NOTICE.
luaux = { package = "alloy-luaux", version = "0.1.0-rc.5", path = "../luaux" }
alloy-syntax = { version = "0.1.0-rc.5", path = "../alloy-syntax" }
alloy-ingot = { version = "0.1.0-rc.5", path = "../alloy-ingot" }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps a data file's keys in document order in the
# module the build writes from it.
toml = { version = "1", features = ["preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
terminal_size = "0.4"

[lints]
workspace = true
